<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <radialGradient id="vsCore" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#f3f4f4" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#c084fc" stop-opacity="0.85"/>
      <stop offset="62%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.1"/>
    </radialGradient>
    <linearGradient id="vsRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="vsGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- orbiting rings (rotate around the sphere for an AR feel) -->
  <g stroke="url(#vsRing)" fill="none" opacity="0.7" filter="url(#vsGlow)">
    <ellipse cx="200" cy="200" rx="150" ry="52" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate"
        from="0 200 200" to="360 200 200" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="200" cy="200" rx="150" ry="52" stroke-width="2" opacity="0.6"
      transform="rotate(60 200 200)">
      <animateTransform attributeName="transform" type="rotate"
        from="60 200 200" to="420 200 200" dur="22s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="200" cy="200" rx="150" ry="52" stroke-width="2" opacity="0.45"
      transform="rotate(120 200 200)">
      <animateTransform attributeName="transform" type="rotate"
        from="120 200 200" to="480 200 200" dur="28s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- luminous core -->
  <circle cx="200" cy="200" r="96" fill="url(#vsCore)" filter="url(#vsGlow)">
    <animate attributeName="r" values="96;104;96" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- inner equalizer bars, gently pulsing -->
  <g fill="#ffffff" opacity="0.9">
    <rect x="176" y="184" width="6" height="32" rx="3">
      <animate attributeName="height" values="32;56;20;32" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="184;172;190;184" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="190" y="176" width="6" height="48" rx="3">
      <animate attributeName="height" values="48;22;60;48" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="176;189;170;176" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="204" y="180" width="6" height="40" rx="3">
      <animate attributeName="height" values="40;60;28;40" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="180;170;186;180" dur="1.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="218" y="186" width="6" height="28" rx="3">
      <animate attributeName="height" values="28;50;18;28" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="186;175;191;186" dur="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
