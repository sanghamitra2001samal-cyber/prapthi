[Service]
# Built-in IndicF5 voices render on the GPU box (~1.4s vs ~37s here). Cloned
# voices stay on this box: the service takes a reference *path*, and a clone
# clip only exists locally. engine.if5_synth falls back here automatically,
# which also covers the minutes when the music engine borrows the GPU.
Environment=IF5_GPU_URL=http://13.201.144.53:8004
Environment=IF5_GPU_REFS=/home/ubuntu/if5_refs
