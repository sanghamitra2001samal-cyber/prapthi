[Service]
# 8 Nov 2026: 300 s kept IndicF5 HD voices on the slow CPU fallback for ~8 min
# after every song or sound effect. The switch back takes ~28 s, the switch
# over ~16 s, so a minute of idle is plenty; songs are rare.
Environment=GPUSWAP_IDLE=60
# The voice services that step aside while a song holds the GPU.
Environment=GPUSWAP_RESIDENT=if5,parler
