  <h1>You're offline</h1>
  <p>Prapthi AI needs an internet connection to create speech. Check your connection and try again.</p>
  <button id="retry" type="button">Try again</button>
  <small id="note">We'll reconnect automatically when you're back online.</small>
</main>
<script>
  (function () {
    var STUDIO = 'https://prapthi.ai/app/';
    var btn = document.getElementById('retry');
    var note = document.getElementById('note');
    var trying = false;

    // Probe before navigating: going to the studio while still offline would
    // only bounce straight back here, which looks like the button is broken.
    function retry() {
      if (trying) return;
      trying = true; btn.disabled = true; btn.textContent = 'Connecting…';
      var done = false;
      var timer = setTimeout(function () { fail(); }, 8000);
      function fail() {
        if (done) return; done = true; clearTimeout(timer);
        trying = false; btn.disabled = false; btn.textContent = 'Try again';
        note.textContent = 'Still no connection. Check Wi-Fi or mobile data.';
      }
      fetch('https://prapthi.ai/api/health', { cache: 'no-store', mode: 'no-cors' })
        .then(function () { if (done) return; done = true; clearTimeout(timer); location.replace(STUDIO); })
        .catch(fail);
    }

    btn.addEventListener('click', retry);
    window.addEventListener('online', retry);
  })();
</script>
